name: Build desktop applications

on:
  workflow_dispatch:
  push:
    branches:
      - packaging-development
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: BulletJournal-macOS

          - os: windows-latest
            artifact_name: BulletJournal-Windows

          - os: ubuntu-latest
            artifact_name: BulletJournal-Linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run tests
        run: python -m unittest -b

      - name: Build macOS application
        if: runner.os == 'macOS'
        run: >
          pyinstaller
          --name BulletJournal
          --windowed
          --onedir
          gui.py

      - name: Build Windows application
        if: runner.os == 'Windows'
        run: >
          pyinstaller
          --name BulletJournal
          --windowed
          --onefile
          gui.py

      - name: Build Linux application
        if: runner.os == 'Linux'
        run: >
          pyinstaller
          --name BulletJournal
          --windowed
          --onefile
          gui.py

      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: >
          ditto -c -k --sequesterRsrc --keepParent
          dist/BulletJournal.app
          dist/BulletJournal-macOS.zip

      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/BulletJournal-macOS.zip
          if-no-files-found: error

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/BulletJournal.exe
          if-no-files-found: error

      - name: Upload Linux build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/BulletJournal
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Show downloaded artifacts
        run: find release-artifacts -maxdepth 3 -type f -print

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            release-artifacts/BulletJournal-macOS/BulletJournal-macOS.zip \
            release-artifacts/BulletJournal-Windows/BulletJournal.exe \
            release-artifacts/BulletJournal-Linux/BulletJournal \
            --verify-tag \
            --generate-notes \
            --title "Bullet Journal ${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
